# Routes like the E2E API Gateway: /{svc}/... for clients and
# /private/{stage}/{svc}/... for remote deps between services.
server {
  listen 80;

  location ~ ^/(private/[^/]+/)?ping-svc/ {
    proxy_pass http://ping-svc:8080;
  }

  location ~ ^/(private/[^/]+/)?pong-svc/ {
    proxy_pass http://pong-svc:8080;
  }

  location ~ ^/(private/[^/]+/)?mono-svc/ {
    proxy_pass http://mono-svc:8080;
  }
}
