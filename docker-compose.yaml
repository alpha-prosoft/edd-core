services:
  opensearch-node1:
    image: ${DOCKER_URL:-}opensearchproject/opensearch:2.11.1
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1
      - cluster.initial_master_nodes=opensearch-node1
      - bootstrap.memory_lock=true # along with the memlock settings below, disables swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # minimum and maximum Java heap size, recommend setting both to 50% of system RAM
      - "DISABLE_SECURITY_PLUGIN=true"
      # The performance-analyzer agent is not needed for tests and its launcher
      # crashes the container ("Could not find or load main class Cannot").
      - "DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    ports:
      - 9200:9200
      - 9600:9600 # required for Performance Analyzer
    networks:
      - opensearch-net
  opensearch-dashboards:
    image: ${DOCKER_URL:-}opensearchproject/opensearch-dashboards:2.11.1
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node1:9200"]' # must be a string with no spaces when specified as an environment variable
    networks:
      - opensearch-net

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pg
      args:
        DOCKER_URL: ${DOCKER_URL:-}
    container_name: postgres_edd
    hostname: postgres
    ports:
      - 5433:5432
    expose:
      - "5432"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "no-secret"
    networks:
      - opensearch-net

  kafka:
    image: ${DOCKER_URL:-}apache/kafka:4.4.0
    container_name: kafka_edd
    hostname: kafka
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - opensearch-net

  kafka-ui:
    image: ${DOCKER_URL:-}kafbat/kafka-ui:v1.5.0
    container_name: kafka_ui_edd
    ports:
      - 8090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: edd
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - opensearch-net

  # E2E services on Undertow + Kafka + Postgres (docker compose --profile e2e),
  # run from the jars e2e/run-e2e-local.sh builds into e2e/target/local.
  ping-svc:
    profiles: [e2e]
    image: ${DOCKER_URL:-}eclipse-temurin:25.0.4.1_1-jre-alpine
    command: java -cp /app/ping-svc.jar clojure.main -m ping-svc.main
    environment: &e2e-env
      ServiceName: ping-svc
      ResourceName: ping-svc
      EnvironmentNameLower: cqrs-e2e
      PublicHostedZoneName: example.com
      AccountId: "000000000000"
      Region: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DatabaseEndpoint: postgres
      DatabasePort: "5432"
      DatabasePassword: no-secret
      KafkaBootstrapServers: kafka:29092
      ApiUrl: http://gateway
    volumes:
      - ./e2e/target/local:/app:ro
    depends_on: [postgres, kafka]
    networks:
      - opensearch-net

  pong-svc:
    profiles: [e2e]
    image: ${DOCKER_URL:-}eclipse-temurin:25.0.4.1_1-jre-alpine
    command: java -cp /app/pong-svc.jar clojure.main -m pong.local
    environment:
      <<: *e2e-env
      ServiceName: pong-svc
      ResourceName: pong-svc
    volumes:
      - ./e2e/target/local:/app:ro
    depends_on: [postgres, kafka]
    networks:
      - opensearch-net

  # One service on the Postgres distributor: no router, no Kafka.
  mono-svc:
    profiles: [e2e]
    image: ${DOCKER_URL:-}eclipse-temurin:25.0.4.1_1-jre-alpine
    command: java -cp /app/mono-svc.jar clojure.main -m mono-svc.main
    environment:
      <<: *e2e-env
      ServiceName: mono-svc
      ResourceName: mono-svc
      CustomConfig: '{"realms": [":test"]}'
    volumes:
      - ./e2e/target/local:/app:ro
    depends_on: [postgres]
    networks:
      - opensearch-net

  router-svc:
    profiles: [e2e]
    image: ${DOCKER_URL:-}eclipse-temurin:25.0.4.1_1-jre-alpine
    command: java -cp /app/router-svc.jar clojure.main -m router.local
    environment:
      <<: *e2e-env
      ServiceName: router-svc
      ResourceName: router-svc
    volumes:
      - ./e2e/target/local:/app:ro
    depends_on: [kafka]
    networks:
      - opensearch-net

  gateway:
    profiles: [e2e]
    image: ${DOCKER_URL:-}nginx:1.30.6-alpine-slim
    ports:
      - 8085:80
    volumes:
      - ./e2e/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ping-svc, pong-svc, mono-svc]
    networks:
      - opensearch-net

networks:
  opensearch-net:
